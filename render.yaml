# Render Blueprint — deploy the PR review bot as a web service.
# Docs: https://render.com/docs/blueprint-spec
#
# 1. Push this repo to GitHub.
# 2. Render dashboard → New → Blueprint → pick this repo.
# 3. Fill in the secret env vars marked `sync: false` (they are NOT stored in
#    this file): GitHub App credentials + your LLM API key.
# 4. Copy the service URL and set it as the GitHub App webhook URL:
#       https://<service>.onrender.com/api/github/webhooks
services:
  - type: web
    name: pr-review-bot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- GitHub App (set these in the dashboard) ---
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Paste the full contents of your App's .pem private key.
      - key: GITHUB_PRIVATE_KEY
        sync: false

      # --- LLM: Gemini free tier via its OpenAI-compatible endpoint ---
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-2.5-flash
      # Get a free key from https://aistudio.google.com (set in dashboard).
      - key: LLM_API_KEY
        sync: false
      # Gemini's OpenAI layer is happiest with generic JSON mode, not strict schema.
      - key: LLM_JSON_MODE
        value: json_object

      # --- Behaviour ---
      - key: SKIP_DRAFTS
        value: "true"
      - key: MAX_DIFF_CHARS
        value: "60000"
